<title>Triumph Motor Company</title>
<meta name="description" content="Used cars for sale at 7160 Canyon Dr, Amarillo, Texas. Cash or bank financing. Se habla español.">

<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:description" content="Used cars in Amarillo, TX. Cash or bank financing. Se habla español.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: maroon header that echoes the business card (centered script logo, tracked caps address)
   → one grid of cars → tap a car for photos + spec sheet. */
:root {
  --brand: #3b1612;        /* Triumph maroon, from the business card */
  --brand-ink: #ffffff;
  --bg: #f5f0ee;           /* warm off-white leaning toward the maroon */
  --surface: #ffffff;
  --ink: #241211;
  --muted: #7a6662;
  --line: #e4d9d5;
  --tag-bg: #3b1612;       /* price tag */
  --tag-ink: #ffffff;
  --action: #3b1612;       /* call buttons */
  --action-ink: #ffffff;
  --pending: #a8561c;
  --display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160b0a; --surface: #221311; --ink: #f2e9e6; --muted: #b29d98; --line: #3a2421;
    --tag-bg: #f2e9e6; --tag-ink: #3b1612; --action: #f2e9e6; --action-ink: #3b1612; --pending: #e08a4e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160b0a; --surface: #221311; --ink: #f2e9e6; --muted: #b29d98; --line: #3a2421;
  --tag-bg: #f2e9e6; --tag-ink: #3b1612; --action: #f2e9e6; --action-ink: #3b1612; --pending: #e08a4e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }
.caps { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .28em; }

/* Header — the business card */
header.dealer { background: var(--brand); color: var(--brand-ink); text-align: center; padding-block: 44px 0; }
.logo { width: min(560px, 86%); margin: 0 auto; }
.logo svg { width: 100%; height: auto; display: block; color: var(--brand-ink); }
.addr { display: inline-block; margin-top: 22px; font-size: clamp(12px, 2.6vw, 15px); letter-spacing: .14em; text-decoration: none; opacity: .92; }
.addr:hover { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }
.addr .dash { opacity: .55; }
.nw { white-space: nowrap; }
.phone { display: block; margin-top: 10px; font-family: var(--display); font-weight: 700; font-size: clamp(22px, 4.5vw, 28px); letter-spacing: .06em; text-decoration: none; }
.perks { margin-top: 30px; border-top: 1px solid rgba(255,255,255,.16); padding-block: 14px; }
.perks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 34px; font-size: 12px; }
.perks li { opacity: .85; }

/* Toolbar */
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 34px 18px; }
.bar h2 { margin: 0; font-size: 15px; }
.bar h2 span { color: var(--muted); font-weight: 500; letter-spacing: .12em; }
.bar label { font-size: 15px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
select { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 22px; padding-bottom: 56px; }
.car {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0; font: inherit; color: inherit;
  transition: transform .15s ease, box-shadow .15s ease;
}
.car:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -16px rgba(59,22,18,.5); }
.car:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
.shot { position: relative; aspect-ratio: 4 / 3; background: var(--line); width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; }
.count { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.66); color: #fff; font-size: 13px; padding: 2px 8px; border-radius: 3px; }
.flag { position: absolute; left: 0; top: 14px; background: var(--pending); color: #fff; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; padding: 5px 12px; }
.flag.new { background: var(--brand); }
.info { padding: 16px 18px 18px; display: grid; gap: 10px; flex: 1; align-content: start; }
.top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.name { min-width: 0; }
.year { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .22em; color: var(--muted); }
.model { margin: 2px 0 0; font-family: var(--display); font-weight: 800; font-size: 21px; line-height: 1.15; text-wrap: balance; }
.trim { color: var(--muted); font-size: 15px; margin-top: 2px; }
.price { flex: none; background: var(--tag-bg); color: var(--tag-ink); font-family: var(--display); font-weight: 800; font-size: 18px; padding: 5px 11px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.specs { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 15px; color: var(--muted); }
.specs b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.empty { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 40px 24px; text-align: center; }
.empty h3 { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 0 0 6px; }
.empty p { margin: 0; color: var(--muted); }

/* Detail sheet */
dialog { border: 0; padding: 0; width: min(1040px, 100vw); max-width: 100vw; max-height: 100dvh; background: var(--surface); color: var(--ink); border-radius: 8px; }
dialog::backdrop { background: rgba(20,8,7,.78); }
@media (max-width: 700px) { dialog { border-radius: 0; height: 100dvh; } }
.sheet { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
@media (max-width: 860px) { .sheet { grid-template-columns: minmax(0, 1fr); } }
.gallery { background: #0e0605; display: grid; grid-template-rows: auto auto; min-width: 0; }
.stage { position: relative; aspect-ratio: 4 / 3; }
.stage img { width: 100%; height: 100%; object-fit: contain; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #3b1612; font-size: 24px; cursor: pointer; display: grid; place-items: center; }
.nav:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.nav.prev { left: 10px; } .nav.next { right: 10px; }
.pos { position: absolute; left: 12px; bottom: 10px; color: #fff; background: rgba(0,0,0,.6); font-size: 13px; padding: 2px 8px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; padding: 8px; scrollbar-width: thin; }
.thumbs button { flex: none; width: 74px; height: 56px; padding: 0; border: 2px solid transparent; border-radius: 3px; overflow: hidden; cursor: pointer; background: #222; opacity: .6; }
.thumbs button[aria-current="true"] { border-color: #fff; opacity: 1; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.detail { padding: 24px 26px 28px; display: grid; gap: 18px; align-content: start; min-width: 0; }
@media (min-width: 861px) { .detail { overflow-y: auto; max-height: min(780px, 92dvh); } }
.close {
  position: absolute; top: 10px; right: 10px; z-index: 2; width: 42px; height: 42px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 28px; line-height: 1; cursor: pointer; display: grid; place-items: center;
}
.close:focus-visible { outline: 3px solid #fff; }
.detail .model { font-size: 26px; }
.sticker { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.sticker h4 { margin: 0; padding: 7px 12px; background: var(--brand); color: var(--brand-ink); font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
.sticker dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
.sticker dt, .sticker dd { margin: 0; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 15px; }
.sticker dt:first-of-type, .sticker dd:first-of-type { border-top: 0; }
.sticker dt { color: var(--muted); }
.sticker dd { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.desc { white-space: pre-line; margin: 0; font-size: 16px; }
.cta { display: grid; gap: 10px; }
.call { display: block; text-align: center; background: var(--action); color: var(--action-ink); text-decoration: none; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .04em; padding: 13px; border-radius: 4px; }
.cta small { color: var(--muted); text-align: center; }

footer { background: var(--brand); color: var(--brand-ink); font-size: 14px; padding-block: 24px 30px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: center; }
footer .caps { font-size: 11px; letter-spacing: .24em; }
footer span { opacity: .8; }

@media (prefers-reduced-motion: reduce) { .car { transition: none; } .car:hover { transform: none; } }
</style>
</head>

  <div class="perks">
    <ul class="wrap caps">
      <li>Cash or bank financing</li>
      <li>Se habla español</li>

</header>

<main class="wrap">
  <div class="bar">
    <h2 class="caps">On the lot <span id="total"></span></h2>
    <label for="sort">Sort
      <select id="sort">
        <option value="new">Newest first</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
        <option value="miles">Lowest miles</option>
      </select>
    </label>
  </div>
  <div class="grid" id="grid" aria-live="polite"></div>
</main>

<footer>
  <div class="wrap">
    <span class="caps">Triumph Motor Company · 7160 Canyon Dr, Ste. 100 · Amarillo, TX</span>
    <span id="updated"></span>
  </div>
</footer>

<dialog id="sheet" aria-label="Vehicle details"></dialog>

<script>
const PHONE_DISPLAY = '(806) 584-7474';
const PHONE_TEL = '+18065847474';
let cars = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = n => n == null ? 'Call' : '$' + Number(n).toLocaleString('en-US');
const miles = n => n == null ? null : Number(n).toLocaleString('en-US');
const cap = s => s ? s.replace(/\b\w/g, c => c.toUpperCase()) : '';
const ownersText = n => n == null ? null : n === 1 ? '1 owner' : `${n} owners`;

function heading(c) {
  const name = [c.make, c.model].filter(Boolean).join(' ') || (c.title || '').replace(/^\d{4}\s*/, '');
  return { year: c.year || '', name: cap(name), trim: c.trim || '' };
}
function isNew(c) {
  const t = Date.parse(c.listedAt || c.firstSeen || '');
  return t && Date.now() - t < 7 * 864e5;
}

function render() {
  const sort = $('#sort').value;
  const list = [...cars].sort((a, b) =>
    sort === 'low' ? (a.price ?? 1e9) - (b.price ?? 1e9) :
    sort === 'high' ? (b.price ?? 0) - (a.price ?? 0) :
    sort === 'miles' ? (a.mileage ?? 1e9) - (b.mileage ?? 1e9) :
    (b.listedAt || '').localeCompare(a.listedAt || ''));
  $('#total').textContent = cars.length ? `· ${cars.length} ${cars.length === 1 ? 'vehicle' : 'vehicles'}` : '';
  if (!list.length) {
    $('#grid').innerHTML = `<div class="empty"><h3>New inventory coming soon</h3>
      <p>Call or text <strong>${PHONE_DISPLAY}</strong> to ask what just came in.</p></div>`;
    return;
  }
  $('#grid').innerHTML = list.map(c => {
    const h = heading(c);
    const flag = c.pending ? '<span class="flag">Sale pending</span>' : isNew(c) ? '<span class="flag new">Just listed</span>' : '';
    const specs = [
      c.mileage != null && `<span><b>${miles(c.mileage)}</b> mi</span>`,
      c.transmission && `<span>${esc(c.transmission)}</span>`,
      c.exteriorColor && `<span>${esc(c.exteriorColor)}</span>`,
    ].filter(Boolean).join('');
    return `<button class="car" data-id="${esc(c.id)}" aria-label="${esc(`${h.year} ${h.name}, ${money(c.price)}`)}">
      <div class="shot">
        ${c.photos?.[0] ? `<img src="${esc(c.photos[0])}" alt="" loading="lazy">` : ''}
        ${flag}
        ${c.photos?.length > 1 ? `<span class="count">${c.photos.length} photos</span>` : ''}
      </div>
      <div class="info">
        <div class="top">
          <div class="name">
            <div class="year">${esc(h.year)}</div>
            <h3 class="model">${esc(h.name)}</h3>
            ${h.trim ? `<div class="trim">${esc(h.trim)}</div>` : ''}
          </div>
          <div class="price">${money(c.price)}</div>
        </div>
        <div class="specs">${specs}</div>
      </div>
    </button>`;
  }).join('');
}

function openCar(id) {
  const c = cars.find(x => x.id === id);
  if (!c) return;
  const h = heading(c);
  const photos = c.photos || [];
  const rows = [
    ['Price', money(c.price)],
    ['Mileage', c.mileage != null ? `${miles(c.mileage)} mi` : null],
    ['Transmission', c.transmission],
    ['Fuel', c.fuel],
    ['Exterior', c.exteriorColor],
    ['Interior', c.interiorColor],
    ['Owners', ownersText(c.owners)],
    ['Title', c.titleStatus],
    ['Paid off', c.paidOff ? 'Yes' : null],
    ['VIN', c.vin],
  ].filter(r => r[1]);
  const sheet = $('#sheet');
  sheet.innerHTML = `<div class="sheet">
    <div class="gallery">
      <div class="stage">
        ${photos.length ? `<img id="big" src="${esc(photos[0])}" alt="${esc(`${h.year} ${h.name}`)}">` : ''}
        ${photos.length > 1 ? `<button class="nav prev" aria-label="Previous photo">‹</button><button class="nav next" aria-label="Next photo">›</button>
        <span class="pos" id="pos">1 / ${photos.length}</span>` : ''}
      </div>
      ${photos.length > 1 ? `<div class="thumbs">${photos.map((p, i) =>
        `<button data-i="${i}" aria-label="Photo ${i + 1}" aria-current="${i === 0}"><img src="${esc(p)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    </div>
    <div class="detail">
      <button class="close" aria-label="Close">×</button>
      <div>
        <div class="year">${esc(h.year)}</div>
        <h3 class="model">${esc(h.name)}</h3>
        ${h.trim ? `<div class="trim">${esc(h.trim)}</div>` : ''}
      </div>
      <div class="sticker"><h4>Vehicle info</h4><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
      ${c.description ? `<p class="desc">${esc(c.description)}</p>` : ''}
      <div class="cta">
        <a class="call" href="tel:${PHONE_TEL}">Call or text ${PHONE_DISPLAY}</a>
        <small>Ask about the ${esc(`${h.year} ${h.name}`)} · <a href="${esc(c.fbUrl)}" target="_blank" rel="noopener">Message on Facebook</a></small>
      </div>
    </div>
  </div>`;
  let i = 0;
  const show = n => {
    if (!photos.length) return;
    i = (n + photos.length) % photos.length;
    sheet.querySelector('#big').src = photos[i];
    const pos = sheet.querySelector('#pos'); if (pos) pos.textContent = `${i + 1} / ${photos.length}`;
    sheet.querySelectorAll('.thumbs button').forEach((b, k) => b.setAttribute('aria-current', k === i));
    sheet.querySelector(`.thumbs button[data-i="${i}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  };
  sheet.querySelector('.prev')?.addEventListener('click', () => show(i - 1));
  sheet.querySelector('.next')?.addEventListener('click', () => show(i + 1));
  sheet.querySelectorAll('.thumbs button').forEach(b => b.addEventListener('click', () => show(+b.dataset.i)));
  sheet.querySelector('.close').addEventListener('click', () => sheet.close());
  sheet.onkeydown = e => { if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); };
  let x0 = null;
  const stage = sheet.querySelector('.stage');
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
  sheet.showModal();
  history.replaceState(null, '', '#car-' + c.id);
}

$('#sheet').addEventListener('close', () => history.replaceState(null, '', location.pathname));
$('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#grid').addEventListener('click', e => { const b = e.target.closest('.car'); if (b) openCar(b.dataset.id); });
$('#sort').addEventListener('change', render);

function load(data) {
  cars = (data.cars || []).filter(c => !c.sold);
  if (data.updatedAt) $('#updated').textContent = 'Inventory updated ' + new Date(data.updatedAt).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  render();
  const m = location.hash.match(/^#car-(\d+)$/);
  if (m) openCar(m[1]);
}

if (window.INVENTORY) load(window.INVENTORY);
else fetch('data/inventory.json', { cache: 'no-cache' }).then(r => r.json()).then(load).catch(() => load({ cars: [] }));
</script>
</body>
</html>
