name: Update inventory from Facebook

on:
  schedule:
    - cron: '7 13-22 * * 1-5'   # hourly check on weekdays, ~8am–5pm Central; the gate below runs the scraper once a week
  workflow_dispatch:           # "Run workflow" button on GitHub (always runs right away)
  push:
    branches: [main]
    paths: ['site/**', 'listings.txt', 'scraper/**']   # editing this workflow file doesn't trigger a scrape

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  # Decides whether today's scrape should happen now. Never touches Facebook.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/data
      - id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "Manual or upload run: going ahead."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          week=$(TZ=America/Chicago date +%G-W%V)
          dow=$(TZ=America/Chicago date +%u)      # 1 = Monday ... 5 = Friday
          hour=$(TZ=America/Chicago date +%-H)
          # A different random-looking weekday and hour each week (Mon–Fri, 9am–4pm Central).
          seed=$(echo -n "$week-triumph" | md5sum | tr -dc '0-9' | cut -c1-8); seed=${seed:-0}
          pick_day=$(( 1 + 10#$seed % 5 ))
          pick_hour=$(( 9 + (10#$seed / 5) % 8 ))
          last=$(cat site/data/last-run.txt 2>/dev/null || echo none)
          # Older runs saved a date (2026-10-14); convert it to its week.
          if echo "$last" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then last=$(date -d "$last" +%G-W%V); fi
          echo "This week: $week  now: day $dow ${hour}:00  this week's pick: day $pick_day ${pick_hour}:00  last scrape: $last"
          if [ "$last" = "$week" ]; then
            echo "Already scraped this week."; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$dow" -gt "$pick_day" ] || { [ "$dow" -eq "$pick_day" ] && [ "$hour" -ge "$pick_hour" ]; }; then
            echo "Time for this week's scrape."; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not yet."; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Scrape Facebook Marketplace
        id: scrape
        continue-on-error: true
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: node scraper/scrape.mjs

      - name: Save changes
        run: |
          # Record this week's run (even if it failed) so a flagged account isn't retried every hour.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            TZ=America/Chicago date +%G-W%V > site/data/last-run.txt
          fi
          git config user.name "inventory-bot"
          git config user.email "inventory-bot@users.noreply.github.com"
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "Update inventory"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report scraper problems
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::The scraper hit a problem (see the 'Scrape Facebook Marketplace' step). The site still shows the last good inventory."
          exit 1
