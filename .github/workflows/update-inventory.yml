name: Update inventory from Facebook

on:
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours
  workflow_dispatch:          # "Run workflow" button on GitHub
  push:
    branches: [main]
    paths: ['site/**', 'listings.txt', 'scraper/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Scrape Facebook Marketplace
        id: scrape
        continue-on-error: true
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: node scraper/scrape.mjs

      - name: Save changes
        run: |
          git config user.name "inventory-bot"
          git config user.email "inventory-bot@users.noreply.github.com"
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "Update inventory"
            git push
          else
            # GitHub pauses scheduled jobs after 60 days without commits; keep it alive.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
              git commit --allow-empty -m "Keep scheduled updates running"
              git push
            fi
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Report scraper problems
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::The scraper hit a problem (see the 'Scrape Facebook Marketplace' step). The site still shows the last good inventory."
          exit 1
